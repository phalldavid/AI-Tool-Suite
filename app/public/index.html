<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Render Studio</title>
<meta name="description" content="Architectural renders from your SketchUp view, CAD export or sketch. Keeps your design, adds Cambodian context.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  // Theme before first paint, so there is no flash of the wrong colours.
  try {
    var p = JSON.parse(localStorage.getItem("drs2.prefs") || "{}");
    var light = p.theme === "light" || (p.theme === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
    if (light) document.documentElement.classList.add("light");
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<noscript>David Render Studio needs JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
