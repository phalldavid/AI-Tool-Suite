name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Ruby syntax check
        run: for f in $(find plugin -name '*.rb'); do ruby -c "$f"; done
      - run: npm run rbz
      - uses: actions/upload-artifact@v6
        with:
          name: ai_render_suite-rbz
          path: dist/ai_render_suite.rbz
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/web

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
